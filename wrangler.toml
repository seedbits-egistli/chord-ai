name = "chord-ai"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Local Pages assets (after `npm run build -w @chord-ai/web`)
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "chord-ai"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[vars]
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
# Use Cloudflare Turnstile test secret in local/dev; override in production dashboard
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
IP_HASH_SALT = "chord-ai-dev-salt-change-me"
PUBLISH_RATE_LIMIT = "10"
PUBLISH_RATE_WINDOW_SEC = "3600"
AUTO_HIDE_REPORT_THRESHOLD = "5"
# Set SKIP_TURNSTILE=1 for automated local tests without widget
SKIP_TURNSTILE = "1"

# Production secrets (set via `wrangler secret put`):
# TURNSTILE_SECRET_KEY, IP_HASH_SALT
